{% extends 'base.html' %}

{% load static %}

{% block favicon %}
    <link rel="shortcut icon" href="{% static 'images/favicon.png' %}" />
{% endblock %}

{% block style %}
    <style>
        body {
            background-color: #000;
        }
        .eyes {
            width: 100%;
            height: 800px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: row;
            column-gap: 20px;
        }

        .eye {
            width: 100px;
            height: 120px;
            border-radius: 100%;
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pupil {
            width: 40px;
            height: 40px;
            border-radius: 101px;
            background-color: #000;
        }
    </style>
{% endblock %}

{% block title %}Bem-Vindo!{% endblock %}

{% block content %}
    <main class="p-5 text-center w-100" style="position: absolute; top: 0; left: 0; min-height: 100vh;">
        <div class="eyes">
            <div class="eye">
                <div class="pupil"></div>
            </div>
            <div class="eye">
                <div class="pupil"></div>
            </div>
        </div>
    </main>

    <script>
        // get both pupils
        const pupils = document.querySelectorAll(".eye .pupil");
        window.addEventListener("mousemove", (e) => {
            pupils.forEach((pupil) => {
                // get x and y postion of cursor
                var rect = pupil.getBoundingClientRect();
                var x = (e.pageX - rect.left) / 30 + "px";
                var y = (e.pageY - rect.top) / 30 + "px";
                pupil.style.transform = "translate3d(" + x + "," + y + ", 0px)";
            });
        });
    </script>
{% endblock %}
